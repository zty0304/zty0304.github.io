# ═══════════════════════════════════════════════════════════════
#  Site settings.
#  Page content is NOT here — it lives in pages/<page>/<page>.yaml
# ═══════════════════════════════════════════════════════════════
baseURL: https://zty0304.github.io/
languageCode: en-us
title: Tianyu Zhang

params:
  # Visual style: "paper" (warm paper, serif headings, vermilion)
  #            or "graphite" (neutral grey, all sans, cobalt)
  style: paper

# Top navigation
menus:
  main:
    - name: Home
      url: /
      weight: 5
    - name: Publications
      url: /publications/
      weight: 10
    - name: Gallery
      url: /gallery/
      weight: 20
    - name: Blog
      url: /blog/
      weight: 30


# ───────────────────────────────────────────────────────────────
#  Plumbing — you normally never touch anything below this line.
#  It maps the simple folder layout (pages/ + theme/) onto Hugo.
# ───────────────────────────────────────────────────────────────
enableRobotsTXT: true
enableEmoji: true            # :tada: style emoji codes in text
buildFuture: true
timeout: 600s
disableKinds: [taxonomy, term]

module:
  mounts:
    # text: pages/<page>/<page>.yaml  →  hugo.Data.<page>
    - { source: pages/home,         target: data, files: ["home.yaml"] }
    - { source: pages/publications, target: data, files: ["publications.yaml"] }
    - { source: pages/gallery,      target: data, files: ["gallery.yaml"] }
    - { source: pages/blog,         target: data, files: ["blog.yaml"] }
    # images: pages/<page>/…  →  assets/<page>/…
    - { source: pages/home,         target: assets/home,         files: ["! **.yaml"] }
    - { source: pages/publications, target: assets/publications, files: ["! **.yaml"] }
    - { source: pages/gallery,      target: assets/gallery,      files: ["! **.yaml"] }
    # blog posts
    - { source: pages/blog/posts,   target: content/blog }
    # files published as-is at the site root (Google verification, a CV PDF …)
    - { source: static,             target: static }
    # theme
    - { source: theme/content,      target: content }
    - { source: theme/layouts,      target: layouts }
    - { source: theme/css,          target: assets/css }
    - { source: theme/js,           target: assets/js }

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

imaging:
  resampleFilter: lanczos
  quality: 85
  anchor: center
