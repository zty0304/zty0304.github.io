# ═══════════════════════════════════════════════════════════════
#  论文 · Publications — every publication, one file.
#  Teaser figures live in pages/publications/figures/.
#
#  group     which section it is listed under (see `groups` below)
#  date      YYYY-MM, used for ordering (newest first) and year filters
#  selected  true → also shown under "Selected publications" on the homepage
#  image     teaser figure, e.g. figures/my-paper.jpg (used on the homepage)
#  venue_short  short venue label shown on the homepage figure, e.g. SIGGRAPH Asia 2026
#  summary   one or two sentences, shown on the homepage
#  award     shown as a small marker next to the venue
#  links     any of: pdf, doi, arxiv, code, project, video, slides, poster
#  bibtex    optional; adds a "BibTeX" button with copy
#
#  Your own name (from home.yaml) is highlighted automatically, and
#  collaborators (home.yaml) are linked automatically.
# ═══════════════════════════════════════════════════════════════

title: Publications
intro: Journal articles, conference papers and academic presentations.

# Year buttons: each year from this one on gets its own button;
# everything older is grouped under "Earlier".
years_from: 2026

# Sections on the Publications page, in this order (top to bottom)
groups:
  - id: journal
    title: Journal Articles
  - id: conference
    title: International Conference Papers
  - id: presentation
    title: International Symposium & Conference Presentations
  - id: domestic
    title: Domestic Conference Presentations
  - id: preprint
    title: Preprints

