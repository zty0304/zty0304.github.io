# Markdown allowed: **bold**, [link](https://…). Blank line = new paragraph.
bio: |
  Tianyu Zhang is a researcher at the Japan Advanced Institute of Science and Technology (JAIST).
  He received his Ph.D. in Information Science from JAIST in September 2026 under the supervision
  of Professor [Haoran Xie](https://www.jaist.ac.jp/~xie/). He also received his master's degree
  in Information Science from JAIST in 2023, and his bachelor's degree in Computer Science from
  Xidian University in 2019.

  His research focuses on explainable AI and controllable AI, multimodal generative models, controllable image generation and editing,
  and AI for creation.

